name: Publish to Hex

on:
  release:
    types:
      - created
      - published

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Get dependencies
        run: mix deps.get

      - name: Publish to hex
        run: mix hex.publish --yes
        working-directory: apps/workflows
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
