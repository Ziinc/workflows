name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  ci:
    name: Elixir ${{ matrix.elixir }}
    env:
      MIX_ENV: test
      MISE_ELIXIR_VERSION: ${{ matrix.elixir }}
      MISE_ERLANG_VERSION: ${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: 1.18.5-otp-27
            otp: 27.3.4
          - elixir: 1.19.6-otp-27
            otp: 27.3.4
          - elixir: 1.20.4-otp-28
            otp: 28.5.0.5

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Cache Mix
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-${{ matrix.elixir }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.elixir }}-mix-
          path: |
            deps
            _build

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

      - name: Run tests
        run: mix test

      - name: Retrieve PLT Cache
        uses: actions/cache@v4
        id: plt-cache
        with:
          path: priv/plts
          key: ${{ runner.os }}-${{ matrix.elixir }}-plts-${{ hashFiles('mix.lock') }}

      - name: Create PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      - name: Run dialyzer
        run: mix dialyzer --no-check --halt-exit-status
